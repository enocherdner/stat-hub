<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d24">
<script>try{document.documentElement.dataset.look=localStorage.getItem("theme")||"gameday";document.documentElement.dataset.ink=localStorage.getItem("ink")||"ice"}catch(e){document.documentElement.dataset.look="gameday";document.documentElement.dataset.ink="ice"}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF Stat Hub">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FF Stat Hub</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=28">
</head>
<body>
<header class="top">
  <a href="#/" class="brand">FF Stat Hub</a>
  <div class="search">
    <input id="q" type="search" placeholder="Search any player…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search players">
    <div id="sugg" class="sugg" role="listbox" hidden></div>
  </div>
</header>
<nav class="tabs">
  <a href="#/" data-tab="news"><span class="ic">📰</span>News</a>
  <a href="#/rankings" data-tab="home"><span class="ic">🏆</span>Rankings</a>
  <a href="#/waivers" data-tab="waivers"><span class="ic">📈</span>Waivers</a>
  <a href="#/ss" data-tab="ss"><span class="ic">✅</span>Start/Sit</a>
  <a href="#/trade" data-tab="trade"><span class="ic">🔁</span>Trade</a>
  <a href="#/roster" data-tab="roster"><span class="ic">👤</span>My Roster</a>
</nav>
<main id="app"><p class="muted pad">Loading…</p></main>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=28"></script>
<script src="field.js?v=28"></script>
</body>
</html>
